runtime: php81

env_variables:
  # Nastavení pro produkční prostředí
  APP_ENV: 'production'
  # Merk API klíč - DŮLEŽITÉ: Změňte před nasazením!
  MERK_API_KEY: 'bHVmmzbrCuwpmAqa68z4inv6bd1xJFLK'

handlers:
  # Statické soubory (pokud budou)
  - url: /\.gitignore
    static_files: .gitignore
    upload: .gitignore
    secure: always

  # Hlavní handler pro PHP soubory
  - url: /.*
    script: auto
    secure: always

# Automatické škálování
automatic_scaling:
  min_instances: 0
  max_instances: 5
  target_cpu_utilization: 0.65
